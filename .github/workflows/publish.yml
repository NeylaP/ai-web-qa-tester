name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build CLI bundle
        run: npx nx run cli:build

      - name: Add shebang and bin wrapper
        run: npx nx run cli:add-shebang

      - name: Copy package metadata to dist
        run: cp cli/package.json dist/cli/package.json

      - name: Publish to npm
        run: npm publish dist/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
